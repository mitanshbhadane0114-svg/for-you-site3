<audio id="bg-music" loop preload="none">
  <source src="assets/i-think-they-call-this-love.mp3" type="audio/mpeg">
</audio>
<script>
(function () {
  function wireMusicButton() {
    var btn = document.querySelector('button[aria-label="toggle music"]');
    var audio = document.getElementById('bg-music');
    if (!btn || !audio) { return setTimeout(wireMusicButton, 300); }
    btn.addEventListener('click', function () {
      if (audio.paused) {
        audio.play().catch(function () { /* file missing or blocked */ });
      } else {
        audio.pause();
      }
    });
  }
  wireMusicButton();
})();
</script>
